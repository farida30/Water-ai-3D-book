<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Водный след искусственного интеллекта — 3D-книга</title>
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#bfe7ff;--bg2:#5aa9e6;--ui:#0b3d6b;--btn:#ffffff;--btnt:#0b3d6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d4e89;--bg2:#08192e;--ui:#e6f4ff;--btn:#e6f4ff;--btnt:#08192e}}
:root[data-theme="dark"]{--bg1:#1d4e89;--bg2:#08192e;--ui:#e6f4ff;--btn:#e6f4ff;--btnt:#08192e}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ui)}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);text-align:center;padding:12px;font-weight:700;font-size:18px;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;justify-content:center;align-items:center}
button{font:700 22px inherit;font-family:inherit;border:0;border-radius:50px;padding:12px 26px;background:var(--btn);color:var(--btnt);cursor:pointer;box-shadow:0 4px 12px #0004}
button:disabled{opacity:.4;cursor:default}
#pg{min-width:90px;text-align:center;font-weight:700}
#qr{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:5}
#qr[hidden]{display:none}
#qr .card{background:#fff;color:#0b3d6b;border-radius:24px;padding:22px;text-align:center;max-width:300px}
#qrbox{display:flex;justify-content:center;padding:10px}
#qu{width:100%;box-sizing:border-box;font-size:12px;padding:6px;margin:8px 0}
</style>
</head>
<body>
<div id="top">💧 Водный след ИИ — листай книгу!</div>
<div id="ui"><button id="pv">‹ Назад</button><span id="pg"></span><button id="nx">Дальше ›</button><button id="qb">📱 QR</button></div>
<div id="qr" hidden><div class="card"><h2>📱 Открой книгу по QR</h2><div id="qrbox"></div><p>Наведи камеру телефона на код</p><input id="qu" value="https://claude.ai/artifact/X7QYBvjftvUUL1mipXNrHo"><button id="qc">Закрыть</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const W=2,H=2.8,N=6,TH=0.015;
const P=[
["Привет, юный исследователь!","🔎","#2a8bd6",["Ты наверняка слышал про искусственный интеллект — ИИ. Он отвечает на вопросы, рисует и помогает учиться.","Но у ИИ есть секрет — «водный след». Давай узнаем, что это!"]],
["Где живёт ИИ?","🏢","#3aa57a",["ИИ живёт не в телефоне, а в огромных зданиях — дата-центрах.","Там стоят тысячи мощных компьютеров — серверов. Они думают очень быстро, и день и ночь."]],
["Компьютеры нагреваются","🔥","#e8793a",["Когда ты бегаешь, тебе становится жарко. Серверы тоже разогреваются от работы.","Если их не охлаждать, они сломаются. Им нужен «душ»!"]],
["Вода-охладитель","💧","#2a8bd6",["Чтобы остудить серверы, часто используют воду. Она забирает тепло и испаряется, как лужа на солнце.","Эту воду потом нужно добавлять снова."]],
["Сколько воды пьёт ИИ?","🥤","#7a5ad6",["По оценкам учёных, на 20–50 ответов ИИ уходит примерно 500 мл воды — как маленькая бутылочка.","А вопросов в мире задают миллиарды!"]],
["Скрытая вода","⚡","#d6a31f",["Электростанции тоже используют воду, чтобы делать электричество для дата-центров.","Так вода тратится там, где мы её не видим. Это и есть скрытый водный след."]],
["Как учат ИИ","🎓","#c2456b",["Сначала ИИ «учат» на огромном количестве текстов. Это недели работы тысяч компьютеров.","По оценкам, на такое обучение могут уходить сотни тысяч литров воды."]],
["Почему это важно?","🌍","#2f9e9e",["Пресной воды на Земле не так много, а в некоторых местах её не хватает.","Поэтому дата-центрам важно беречь воду и использовать её разумно."]],
["Как это решают?","🔧","#4d6fd6",["Инженеры придумывают, как охлаждать воздухом, использовать дождевую и очищенную воду, строить дата-центры в прохладных местах.","Компьютеры тоже учатся быть экономнее."]],
["Что можем сделать мы?","🦸","#3aa57a",["Задавай ИИ вопросы, когда это правда нужно.","Закрывай кран, пока чистишь зубы. Выключай то, чем не пользуешься.","Расскажи друзьям о водном следе!"]],
["Проверь себя!","❓","#e8793a",["1. Где живёт ИИ?","2. Зачем серверам вода?","3. Как беречь воду дома?","Ответы: 1 — в дата-центре, 2 — чтобы охлаждать, 3 — закрывать кран. Ты молодец! 🏆"]]
];
function wrap(x,t,px,py,mw,lh){let l='',y=py;for(const w of t.split(' ')){const s=l?l+' '+w:w;if(x.measureText(s).width>mw&&l){x.fillText(l,px,y);l=w;y+=lh}else l=s}x.fillText(l,px,y);return y+lh}
function waves(x,col){x.fillStyle=col;x.beginPath();x.moveTo(0,1075);for(let i=0;i<=768;i+=8)x.lineTo(i,1030+Math.sin(i/45)*14);x.lineTo(768,1075);x.fill()}
function tex(i){
 const c=document.createElement('canvas');c.width=768;c.height=1075;const x=c.getContext('2d');
 x.textAlign='center';
 if(i===0||i===99){
  const g=x.createLinearGradient(0,0,0,1075);g.addColorStop(0,i?'#2a8bd6':'#59b8f2');g.addColorStop(1,'#0d3b73');x.fillStyle=g;x.fillRect(0,0,768,1075);
  x.fillStyle='#fff';x.font='bold 64px "Trebuchet MS",Arial';
  if(i===0){let y=wrap(x,'Водный след искусственного интеллекта',384,160,640,78);
   
   x.font='bold 40px "Trebuchet MS",Arial';x.fillText('Книга для младших школьников',384,960);}
  else{x.font='200px sans-serif';x.fillText('🌊',384,480);x.font='bold 80px "Trebuchet MS",Arial';x.fillText('Конец',384,640);
   x.font='38px "Trebuchet MS",Arial';wrap(x,'Береги воду — и Землю, и себя!',384,740,600,52)}
  waves(x,'#ffffff55');return new THREE.CanvasTexture(c);
 }
 const d=P[i-1];
 x.fillStyle='#fffbf0';x.fillRect(0,0,768,1075);
 x.fillStyle=d[2];x.fillRect(0,0,768,250);
 x.fillStyle='#fff';x.font='bold 54px "Trebuchet MS",Arial';wrap(x,d[0],384,100,660,66);
 
 x.textAlign='left';x.fillStyle='#16324f';x.font='36px "Trebuchet MS",Arial';
 let y=530;for(const t of d[3])y=wrap(x,t,60,y,648,50)+10;
 waves(x,'#bfe7ff');x.fillStyle='#0b3d6b';x.textAlign='center';x.font='bold 28px Arial';x.fillText(String(i),384,1058);
 return new THREE.CanvasTexture(c);
}
const cv=document.createElement('canvas');document.body.prepend(cv);
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,50);
const root=new THREE.Group(),book=new THREE.Group();root.add(book);S.add(root);
const mat=t=>new THREE.MeshBasicMaterial({map:t});
const plane=(t)=>new THREE.Mesh(new THREE.PlaneGeometry(W,H),mat(t));
S.add(new THREE.AmbientLight(0xffffff,.8));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(2,3,5);S.add(dl);
const M3=(g,c,o)=>new THREE.Mesh(g,new THREE.MeshLambertMaterial(Object.assign({color:c},o||{})));
const bx=(p,w,h,d,c,x,y,z)=>{const m=M3(new THREE.BoxGeometry(w,h,d),c);m.position.set(x,y,z);p.add(m);return m};
const sp=(p,r,c,x,y,z,o)=>{const m=M3(new THREE.SphereGeometry(r,20,16),c,o);m.position.set(x,y,z);p.add(m);return m};
const cy=(p,r1,r2,h,c,x,y,z,o)=>{const m=M3(new THREE.CylinderGeometry(r1,r2,h,24),c,o);m.position.set(x,y,z);p.add(m);return m};
const lat=(a,c,x)=>{const m=M3(new THREE.LatheGeometry(a.map(v=>new THREE.Vector2(v[0],v[1])),24),c,{side:2});m.position.x=x||0;return m};
const drop=s=>{const g=new THREE.Group(),o={transparent:true,opacity:.92};sp(g,.22,0x2aa8ff,0,0,0,o);const c=M3(new THREE.ConeGeometry(.2,.42,24),0x2aa8ff,o);c.position.y=.3;g.add(c);g.scale.setScalar(s);return g};
const rack=(p,x,c,l)=>{bx(p,.4,.7,.3,c,x,0,0);for(let i=0;i<5;i++){bx(p,.3,.06,.02,0x222222,x,-.27+i*.13,.16);bx(p,.05,.05,.03,l[i%l.length],x+.1,-.27+i*.13,.17)}};
const phone=(p,x,y)=>{bx(p,.3,.55,.04,0x222233,x,y,0);bx(p,.26,.48,.01,0x33ddff,x,y,.025)};
const mon=(p,x,y,s,c)=>{const g=new THREE.Group();bx(g,.5,.34,.04,0x333344,0,.2,0);bx(g,.44,.28,.01,c||0x66ccff,0,.2,.03);bx(g,.06,.1,.04,0x333344,0,0,0);bx(g,.24,.03,.12,0x333344,0,-.05,0);g.position.set(x,y,0);g.scale.setScalar(s);p.add(g)};
const cl=(p,x,y)=>[[0,0,.18],[.18,-.04,.14],[-.18,-.04,.14]].forEach(a=>sp(p,a[2],0xffffff,x+a[0],y+a[1],0));
const MK={
0:p=>p.add(drop(1.4)),
1:p=>{bx(p,.7,.55,.5,0x4d9fff,0,0,0);[-.15,.15].forEach(x=>{sp(p,.09,0xffffff,x,.08,.26);sp(p,.04,0x111111,x,.08,.34)});bx(p,.28,.05,.03,0xff5577,0,-.14,.26);cy(p,.015,.015,.25,0x999999,0,.4,0);sp(p,.06,0xff5577,0,.55,0);bx(p,.1,.2,.2,0xffcc33,-.4,0,0);bx(p,.1,.2,.2,0xffcc33,.4,0,0)},
2:p=>{bx(p,1.2,.5,.5,0x6c7bd9,0,-.1,0);bx(p,1.2,.06,.52,0x2f3a8f,0,.18,0);const k=[0x3cff9a,0xffd93c,0xff5c8a];for(let i=0;i<6;i++){bx(p,.12,.1,.02,k[i%3],-.5+i*.2,-.05,.26);bx(p,.12,.1,.02,k[(i+1)%3],-.5+i*.2,-.22,.26)}cy(p,.12,.12,.25,0xdddddd,-.4,.33,0);cy(p,.12,.12,.25,0xdddddd,.4,.33,0)},
3:p=>{rack(p,-.3,0xe0533a,[0xff2222,0xffaa00]);rack(p,.3,0xe0533a,[0xffaa00,0xff2222]);const fs=[];for(let i=0;i<4;i++){const f=M3(new THREE.ConeGeometry(.1,.3,12),i%2?0xffaa00:0xff4422);f.position.set(-.45+i*.3,.55,0);p.add(f);fs.push(f)}p.userData.t=t=>fs.forEach((f,i)=>f.scale.y=1+.35*Math.sin(t*8+i))},
4:p=>{rack(p,0,0x2a8bd6,[0x3cff9a,0x66ddff]);const X=[-.6,-.35,.35,.6],ds=X.map(x=>{const d=drop(.4);p.add(d);return d});p.userData.t=t=>ds.forEach((d,i)=>d.position.set(X[i],.5-((t*.5+i*.25)%1)*1.1,0))},
5:p=>{phone(p,-.35,0);cy(p,.17,.17,.7,0x66ccff,.3,-.05,0,{transparent:true,opacity:.55});cy(p,.15,.15,.4,0x2a8bd6,.3,-.2,0);cy(p,.07,.1,.12,0xff5c8a,.3,.36,0)},
6:p=>{p.add(lat([[.3,-.4],[.2,-.1],[.17,.15],[.22,.4]],0xcfd8e3,-.35));sp(p,.12,0xffffff,-.35,.55,0);sp(p,.09,0xffffff,-.25,.7,0);const s=new THREE.Shape();[[0,.45],[-.2,0],[-.03,0],[-.15,-.45],[.2,.07],[.04,.07],[.15,.45]].forEach((a,i)=>i?s.lineTo(a[0],a[1]):s.moveTo(a[0],a[1]));const b=M3(new THREE.ExtrudeGeometry(s,{depth:.06,bevelEnabled:false}),0xffd93c);b.position.set(.4,0,0);p.add(b)},
7:p=>{for(let i=0;i<6;i++)mon(p,-.5+(i%3)*.5,.1-Math.floor(i/3)*.4,.8,[0x66ccff,0x3cff9a,0xffd93c][i%3]);const d=drop(.35);d.position.y=.5;p.add(d)},
8:p=>{const e=new THREE.Group();sp(e,.45,0x2a8bd6,0,0,0);for(let i=0;i<6;i++){const m=M3(new THREE.SphereGeometry(.17,12,8),0x4cc15a),v=new THREE.Vector3(Math.sin(i*2.1),Math.cos(i*1.3),Math.sin(i*.9+1)).normalize();m.position.copy(v).multiplyScalar(.43);m.lookAt(v.clone().multiplyScalar(2));m.scale.z=.35;e.add(m)}p.add(e);p.userData.t=t=>e.rotation.y=t*.6},
9:p=>{cy(p,.03,.05,.9,0xeeeeee,-.3,-.1,0);const r=new THREE.Group();r.position.set(-.3,.35,.05);for(let i=0;i<3;i++){const w=new THREE.Group();w.rotation.z=i*2.094;bx(w,.07,.45,.02,0xffffff,0,.22,0);r.add(w)}sp(r,.05,0xff5c8a,0,0,.02);p.add(r);cl(p,.4,.35);const d=drop(.3);d.position.set(.4,-.1,0);p.add(d);p.userData.t=t=>r.rotation.z=t*2},
10:p=>{cy(p,.07,.07,.6,0xb0b8c4,-.2,.45,0).rotation.z=Math.PI/2;cy(p,.07,.07,.22,0xb0b8c4,.1,.34,0);cy(p,.03,.03,.15,0xe0533a,-.3,.58,0);bx(p,.18,.03,.03,0xe0533a,-.3,.66,0);const ds=[0,1].map(()=>{const d=drop(.3);p.add(d);return d});p.userData.t=t=>ds.forEach((d,i)=>d.position.set(.1,.2-((t*.7+i*.5)%1)*.8,0))},
11:p=>{p.add(lat([[0,-.4],[.22,-.4],[.22,-.33],[.05,-.3],[.05,-.1],[.28,.05],[.3,.4],[0,.4]],0xffc928));[-.55,.55].forEach(x=>{const d=drop(.4);d.position.set(x,-.1,0);p.add(d)})}
};
const pops=[];
function pop(mesh,f){const p=new THREE.Group(),q=new THREE.Group();MK[f](q);p.add(q);p.position.set(0,f?.4:-.4,.12);p.scale.setScalar(.001);mesh.add(p);pops.push({p,q,f,s:0})}
const sheets=[];
for(let i=0;i<N;i++){
 const g=new THREE.Group(),f=plane(tex(i*2)),b=plane(tex(i*2+1));
 f.position.set(W/2,0,.003);b.position.set(W/2,0,-.003);b.rotation.y=Math.PI;
 g.add(f,b);pop(f,i*2);pop(b,i*2+1);g.userData={t:0,i};book.add(g);sheets.push(g);
}
const bz=-N*TH-.04;
const rb=plane(tex(99));rb.position.set(W/2,0,bz);book.add(rb);
const lb=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshBasicMaterial({color:0x0d3b73}));lb.position.set(-W/2,0,bz);lb.rotation.y=Math.PI;book.add(lb);
const sh=document.createElement('canvas');sh.width=sh.height=128;
{const x=sh.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(0,20,50,.45)');g.addColorStop(1,'rgba(0,20,50,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(6,1.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sh),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-H/2-.35;root.add(shadow);
let cur=0;const ptr={x:0,y:0};
const pv=document.getElementById('pv'),nx=document.getElementById('nx'),pg=document.getElementById('pg');
function go(d){cur=Math.max(0,Math.min(N,cur+d));upd()}
function upd(){pv.disabled=cur===0;nx.disabled=cur===N;pg.textContent=cur===0?'Обложка':cur===N?'Конец':'Разворот '+cur+' из '+(N-1)}
pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
cv.addEventListener('click',e=>go(e.clientX>innerWidth/2?1:-1));
addEventListener('pointermove',e=>{ptr.x=e.clientX/innerWidth-.5;ptr.y=e.clientY/innerHeight-.5});
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;
 C.position.z=Math.max(5.2,4.9/(.728*C.aspect));C.updateProjectionMatrix()}
addEventListener('resize',rs);rs();upd();
const qr=document.getElementById('qr'),qu=document.getElementById('qu');
function mkqr(){const b=document.getElementById('qrbox');b.innerHTML='';try{new QRCode(b,{text:qu.value,width:240,height:240,colorDark:'#0b3d6b',colorLight:'#ffffff'})}catch(e){b.textContent=qu.value}}
document.getElementById('qb').onclick=()=>{qr.hidden=false;mkqr()};
document.getElementById('qc').onclick=()=>{qr.hidden=true};
qu.addEventListener('change',mkqr);
try{if(/^https?:/.test(location.href)&&!/claude|anthropic/.test(location.host))qu.value=location.href}catch(e){}
const ease=t=>t*t*(3-2*t);
function tick(){
 let sum=0;
 for(const g of sheets){const u=g.userData,tg=u.i<cur?1:0;u.t+=(tg-u.t)*.07;if(Math.abs(tg-u.t)<.001)u.t=tg;
  const s=ease(u.t);g.rotation.y=-Math.PI*s;
  g.position.z=(1-s)*(-u.i*TH)+s*(-(N-u.i)*TH)+Math.sin(Math.PI*s)*.25;sum+=u.t}
 book.position.x=-W/2+W*(sum/N);
 const tm=performance.now()/1000;
 for(const o of pops){const u=sheets[o.f>>1].userData,v=o.f&1?(u.i===cur-1&&u.t>.5):(u.i===cur&&u.t<.5);o.s+=((v?1:0)-o.s)*.12;o.p.visible=o.s>.02;o.p.scale.setScalar(Math.max(o.s*(o.f?.7:1),.001));o.q.position.y=Math.sin(tm*2+o.f)*.03;o.q.rotation.y=Math.sin(tm+o.f)*.35;if(o.q.userData.t)o.q.userData.t(tm)}
 root.rotation.x+=((-.22+ptr.y*.25)-root.rotation.x)*.06;
 root.rotation.y+=((ptr.x*.5)-root.rotation.y)*.06;
 R.render(S,C);requestAnimationFrame(tick)}
tick();
</script>
</body>
</html>
